server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        set $catalog_api catalog-api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$catalog_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /benchmark-assets/ {
        set $catalog_api catalog-api:3000;
        proxy_pass http://$catalog_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /react {
        return 301 /react/;
    }
    location /react/ {
        set $react_app react:5173;
        rewrite ^/react/(.*)$ /$1 break;
        proxy_pass http://$react_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /vue {
        return 301 /vue/;
    }
    location /vue/ {
        set $vue_app vue:5174;
        rewrite ^/vue/(.*)$ /$1 break;
        proxy_pass http://$vue_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /angular {
        return 301 /angular/;
    }
    location /angular/ {
        set $angular_app angular:4000;
        proxy_pass http://$angular_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 302 /react/csr;
    }
}
