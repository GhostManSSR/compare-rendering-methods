name: Python ML app

on:
  push:
    paths:
      - "ml_app/**"
      - "Makefile"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "ml_app/**"
      - "Makefile"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml_app/requirements.txt

      - name: Install dependencies
        run: make install

      - name: Test model and profile matrix
        run: make test
