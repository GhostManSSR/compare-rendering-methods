
name: Lighthouse benchmark

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "apps-angular/**"
      - "apps-react/**"
      - "apps-vue/**"
      - "data/**"
      - "scripts/**"
      - "Dockerfile.*"
      - "docker-compose.yml"
      - "nginx.conf"
      - ".lighthouserc.json"
      - ".lighthouserc.docker.json"
      - "package-lock.json"
      - "package.json"
      - ".github/workflows/lighthouse.yml"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and start applications
        run: docker compose up --build -d

      - name: Check deployment
        run: npm run benchmark:check

      - name: Build Lighthouse runner
        run: docker compose --profile tools build lighthouse-runner

      - name: Run Lighthouse benchmark
        env:
          BENCHMARK_RUNS: "10"
        run: npm run benchmark:lighthouse:docker

      - name: Run Lighthouse CI
        run: npm run benchmark:lhci:docker

      - name: Upload Lighthouse benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-benchmark
          path: artifacts/lighthouse/
          if-no-files-found: warn

      - name: Upload Lighthouse CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci
          path: artifacts/lhci/
          if-no-files-found: warn

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Stop containers
        if: always()
        run: docker compose down

      - name: Package Python app and benchmark results
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          mkdir -p release-package
          git archive HEAD | tar -xf - -C release-package
          mkdir -p release-package/artifacts/lighthouse
          cp artifacts/lighthouse/samples.json artifacts/lighthouse/summary.json artifacts/lighthouse/summary.csv release-package/artifacts/lighthouse/
          test -s release-package/artifacts/lighthouse/samples.json
          test -s release-package/artifacts/lighthouse/summary.json
          test -s release-package/artifacts/lighthouse/summary.csv
          (cd release-package && zip -qr ../lighthouse-benchmark-app.zip .)

      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-benchmark-app
          path: lighthouse-benchmark-app.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lighthouse
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-benchmark-app

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" lighthouse-benchmark-app.zip --title "$GITHUB_REF_NAME" --generate-notes
